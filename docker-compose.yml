services:
  frontend:
    build:
      context: ./frontend
    container_name: legal-copilot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: legal-copilot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Session store lives here as a plain SQLite file (see README "Design decisions")
      - ./data/crawler_state:/data/crawler_state
      # Shared with law-crawler so the embedding model downloads once and
      # survives image rebuilds.
      - ./data/hf_cache:/root/.cache/huggingface
    depends_on:
      - vector-db
    # LLM engine (Ollama) is intentionally NOT a compose service — it runs
    # on the host per the architecture doc (Section 2.1). host.docker.internal
    # lets the backend container reach it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  vector-db:
    # Pinned to match qdrant-client==1.9.1 in both requirements files.
    image: qdrant/qdrant:v1.9.0
    container_name: legal-copilot-vector-db
    ports:
      - "6333:6333"
    volumes:
      - vector_db_data:/qdrant/storage

  # Offline batch job — not part of the always-on chat flow.
  # Run explicitly with: docker-compose --profile crawler run law-crawler
  law-crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    container_name: legal-copilot-crawler
    profiles: ["crawler"]
    env_file:
      - .env
    volumes:
      - ./data/raw:/data/raw
      - ./data/processed:/data/processed
      - ./data/crawler_state:/data/crawler_state
      - ./data/hf_cache:/root/.cache/huggingface
    depends_on:
      - vector-db

volumes:
  vector_db_data:
